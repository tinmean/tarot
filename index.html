<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>老K塔羅抽牌</title>
  <style>
    :root {
      --bg-color: #0f0c29;
      --bg-gradient: linear-gradient(to bottom, #0f0c29, #302b63, #24243e);
      --panel-bg: rgba(255, 255, 255, 0.05);
      --text-color: #e0e0e0;
      --accent-color: #f1c40f;
      /* 加大基準卡片尺寸 */
      --card-width: 140px;
      --card-height: 238px;
    }

    * { box-sizing: border-box; }

    body {
      font-family: "PingFang TC", "Microsoft JhengHei", sans-serif;
      background: var(--bg-gradient);
      background-attachment: fixed;
      color: var(--text-color);
      margin: 0;
      padding: 15px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      overflow-x: hidden;
    }

    h1 {
      color: var(--accent-color);
      text-shadow: 0 0 10px rgba(241, 196, 15, 0.5);
      font-size: 1.8rem;
      margin: 20px 0 15px 0;
      text-align: center;
    }

    /* ===== 新增：導航連結區塊樣式 (深色主題適配) ===== */
    .nav-links {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
      margin-bottom: 25px;
      padding: 12px 30px;
      background: rgba(0, 0, 0, 0.3);
      border-radius: 50px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(5px);
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    }

    .nav-links a {
      color: #ccc;
      text-decoration: none;
      font-size: 15px;
      font-weight: 500;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .nav-links a:hover {
      color: var(--accent-color);
      text-shadow: 0 0 8px rgba(241, 196, 15, 0.8);
      transform: translateY(-1px);
    }

    .nav-separator {
      color: rgba(255, 255, 255, 0.2);
    }

    /* 控制面板 */
    .controls {
      background: var(--panel-bg);
      backdrop-filter: blur(10px);
      padding: 20px;
      border-radius: 15px;
      width: 100%;
      max-width: 1000px;
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      margin-bottom: 25px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    .control-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex: 1;
      min-width: 200px;
    }

    label { font-size: 14px; color: var(--accent-color); font-weight: bold; }

    input[type="text"], select {
      padding: 12px;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.2);
      background: rgba(0,0,0,0.4);
      color: white;
      outline: none;
      font-size: 15px;
      width: 100%;
    }

    .checkbox-group {
      display: flex;
      gap: 15px;
      align-items: center;
      height: 45px;
      font-size: 15px;
    }

    button {
      cursor: pointer;
      font-weight: bold;
      transition: all 0.3s;
      border: none;
    }

    button#drawBtn {
      width: 100%;
      padding: 16px;
      background: var(--accent-color);
      color: #1a1a2e;
      border-radius: 12px;
      font-size: 18px;
      margin-top: 10px;
      box-shadow: 0 4px 15px rgba(241, 196, 15, 0.3);
    }

    button#drawBtn:hover { 
      transform: translateY(-2px); 
      box-shadow: 0 0 25px var(--accent-color);
    }

    /* 歷史紀錄按鈕 */
    .history-controls {
      display: flex;
      gap: 10px;
      margin-bottom: 12px;
    }

    .btn-small {
      padding: 8px 16px;
      font-size: 13px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.1);
      color: var(--text-color);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }
    .btn-small:hover { background: rgba(255, 255, 255, 0.2); color: white; }
    .btn-danger:hover { background: #c0392b; color: white; border-color: #c0392b; }

    /* 牌陣展示區域 */
    .spread-viewport {
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      margin-top: 30px;
      min-height: 700px; /* 加高以容納大圖 */
      padding-bottom: 100px;
    }

    #spreadContainer {
      position: relative;
      transform-origin: top center;
      transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .spread-area { position: relative; margin: 0 auto; }

    /* 線性排列 (大尺寸適配) */
    .layout-linear {
      display: flex;
      gap: 20px;
      justify-content: center;
      flex-wrap: nowrap;
    }

    .card-slot {
      position: relative;
      width: var(--card-width);
      height: var(--card-height);
    }

    .card {
      width: 100%;
      height: 100%;
      background: #111;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 10px 25px rgba(0,0,0,0.6);
      cursor: pointer;
      position: relative;
      transition: transform 0.3s, box-shadow 0.3s;
      border: 1px solid rgba(255,255,255,0.15);
    }

    .card:hover { 
      transform: translateY(-10px) scale(1.03); 
      box-shadow: 0 15px 35px rgba(241, 196, 15, 0.4); 
      z-index: 50;
    }
    .card img { width: 100%; height: 100%; object-fit: cover; }
    .card.reversed img { transform: rotate(180deg); }

    .card-label {
      position: absolute;
      bottom: 0;
      width: 100%;
      background: rgba(0,0,0,0.85);
      color: #fff;
      font-size: 11px;
      text-align: center;
      padding: 6px 0;
      backdrop-filter: blur(5px);
    }

    .pos-tag {
      position: absolute;
      top: -30px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 13px;
      color: var(--accent-color);
      white-space: nowrap;
      text-align: center;
      font-weight: bold;
      text-shadow: 0 2px 4px rgba(0,0,0,0.8);
    }

    /* 複雜陣型寬高 (基準值加大) */
    .spread-area.layout-custom { width: 800px; height: 750px; }
    .spread-area.layout-circle { width: 750px; height: 750px; }
     
    .overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.96);
      display: none; justify-content: center; align-items: center; z-index: 2000;
      backdrop-filter: blur(10px);
    }
    .overlay.active { display: flex; }
    .overlay-content { text-align: center; max-width: 95%; }
    .overlay img { max-height: 80vh; border-radius: 15px; border: 3px solid var(--accent-color); box-shadow: 0 0 50px rgba(241, 196, 15, 0.2); }

    .history-section {
      width: 100%; max-width: 1000px; margin-top: 40px;
      background: var(--panel-bg); padding: 25px; border-radius: 15px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    textarea { 
      width: 100%; background: #050505; color: #ccc; border: 1px solid #222; 
      padding: 15px; font-size: 14px; resize: vertical; line-height: 1.7; 
      border-radius: 10px;
    }

    .fallback { display: flex; align-items: center; justify-content: center; height: 100%; background: #222; color: #555; font-size: 12px; text-align: center; padding: 10px; }

    @media (max-width: 600px) {
      h1 { font-size: 1.4rem; }
      .controls { padding: 15px; }
      
      /* 手機版導航調整 */
      .nav-links {
        padding: 10px 15px;
        gap: 10px;
        width: 100%;
        border-radius: 15px;
      }
      .nav-links a { font-size: 13px; }
    }
  </style>
</head>
<body>

  <h1>🔮 老K塔羅抽牌</h1>

  <!-- 修改：新增導航連結區塊 -->
  <div class="nav-links">
    <a href="https://kfacehand.com" target="_blank" rel="noopener noreferrer">🏠 老K手面相</a>
    <span class="nav-separator">|</span>
    <a href="https://learn.kfacehand.com" target="_blank" rel="noopener noreferrer">📚 K書中心</a>
    <span class="nav-separator">|</span>
    <a href="https://www.facebook.com/kfacehand" target="_blank" rel="noopener noreferrer">👍 FB粉絲團</a>
    <span class="nav-separator">|</span>
    <a href="https://tinmean.github.io/tarot/README.md" target="_blank" rel="noopener noreferrer">📖 程式說明</a>
  </div>

  <div class="controls">
    <div class="control-group">
      <label>您的問題</label>
      <input type="text" id="question" placeholder="輸入想問的事情，讓牌卡指引您..." />
    </div>

    <div class="control-group">
      <label>1. 選擇張數</label>
      <select id="cardCount">
        <option value="1">1 張牌</option>
        <option value="3">3 張牌</option>
        <option value="5" selected>5 張牌</option>
        <option value="7">7 張牌</option>
        <option value="10">10 張牌</option>
        <option value="12">12 張牌</option>
      </select>
    </div>

    <div class="control-group">
      <label>2. 選擇牌陣</label>
      <select id="spreadVariant">
        <!-- 會由 JS 動態生成 -->
      </select>
    </div>

    <div class="control-group">
      <label>功能設定</label>
      <div class="checkbox-group">
        <label><input type="checkbox" id="incMajor" checked> 大牌</label>
        <label><input type="checkbox" id="incMinor" checked> 小牌</label>
        <label><input type="checkbox" id="allowRev" checked> 逆位</label>
      </div>
    </div>

    <div class="control-group">
      <label for="deckStyle">牌組樣式</label>
      <select id="deckStyle">
        <option value="rider">偉特塔羅（預設）</option>
        <option value="marseille">馬賽塔羅</option>
      </select>
    </div>

    <button id="drawBtn">✨ 開始洗牌抽牌</button>
  </div>

  <div class="spread-viewport">
    <div id="spreadContainer"></div>
  </div>

  <div class="history-section">
    <label>歷史占卜紀錄 (已自動儲存)</label>
    <div class="history-controls">
      <button onclick="copyLatestHistory(this)" class="btn-small">複製最新</button>
      <button onclick="copyAllHistory(this)" class="btn-small">複製全部</button>
      <button onclick="clearHistory()" class="btn-small btn-danger">清除紀錄</button>
    </div>
    <textarea id="history" rows="8" readonly></textarea>
  </div>

  <div class="overlay" id="overlay" onclick="this.classList.remove('active')">
    <div class="overlay-content">
      <img id="overlayImg" src="">
      <h3 id="overlayTitle" style="color:var(--accent-color); margin: 20px 0 5px 0; font-size: 24px;"></h3>
      <p id="overlayPos" style="font-size:16px; margin: 0; color: #aaa;"></p>
    </div>
  </div>

  <script>
    const STORAGE_KEY = "tarot_history_log"; // 定義儲存的 Key

    const MAJOR_NAMES = ["愚者", "魔術師", "女祭司", "皇后", "皇帝", "教皇", "戀人", "戰車", "力量", "隱者", "命運之輪", "正義", "倒吊人", "死神", "節制", "惡魔", "高塔", "星星", "月亮", "太陽", "審判", "世界"];
    const SUITS = [
      { name: "權杖", code: "wands" },
      { name: "聖杯", code: "cups" },
      { name: "寶劍", code: "swords" },
      { name: "錢幣", code: "pents" }
    ];
    const TAROT_DECKS = {
      rider: {
        label: "偉特塔羅",
        imageBaseUrl: "./images/",
        majorFile: i => `maj${String(i).padStart(2, '0')}.jpg`,
        suitCodeMap: { wands: "wands", cups: "cups", swords: "swords", pents: "pents" }
      },
      marseille: {
        label: "馬賽塔羅",
        imageBaseUrl: "./mar_images/",
        // 馬賽大阿爾卡納與偉特在 VIII / XI（力量 / 正義）順序不同，需對調
        majorFile: i => {
          const marseilleIndex = i === 8 ? 11 : (i === 11 ? 8 : i);
          return `a${String(marseilleIndex + 1).padStart(2, '0')}.jpg`;
        },
        suitCodeMap: { wands: "b", cups: "c", swords: "e", pents: "d" }
      }
    };

    // 牌陣座標隨大卡片尺寸調整 (以 140px 為基準)
    const SPREAD_CONFIG = {
      "1": { "one": { type: 'linear', labels: ['啟示'] } },
      "3": {
        "neglect3": { type: 'linear', labels: ['', '', ''], hideTags: true, anonymousResult: true },
        "ppf": { type: 'linear', labels: ['過去', '現在', '未來'] },
        "spa": { type: 'linear', labels: ['現況', '問題', '建議'] },
        "bms": { type: 'linear', labels: ['身', '心', '靈'] }
      },
      "5": {
        "neglect": { type: 'linear', labels: ['1', '2', '3', '4', '5'], hideTags: true },
        "choice": { type: 'linear', labels: ['選項A', '趨勢A', '選項B', '趨勢B', '建議'] },
        "relation": { type: 'linear', labels: ['本人狀態➊', '我方態度➋', '對方狀態➌', '對方態度➍', '可能結果➎'] }
      },
      "7": { "weekly": { type: 'linear', labels: ['週一', '週二', '週三', '週四', '週五', '週六', '週日'] } },
      "10": {
        "celtic": { 
          type: 'custom', 
          labels: ['1.現況', '2.阻礙', '3.基礎', '4.過去', '5.目標', '6.未來', '7.自我', '8.環境', '9.希望', '10.結果'],
          coords: [
            { x: 200, y: 220 }, { x: 200, y: 220, rotate: 90, z: 10 }, { x: 200, y: 485 }, 
            { x: 10, y: 220 }, { x: 200, y: -45 }, { x: 390, y: 220 }, 
            { x: 620, y: 485 }, { x: 620, y: 310 }, { x: 620, y: 135 }, { x: 620, y: -40 }
          ]
        }
      },
      "12": {
        "houses": { type: 'circle', labels: ['1.命宮/自我', '2.財帛/財運', '3.兄弟/溝通', '4.田宅/家庭', '5.子女/戀愛', '6.奴僕/健康', '7.夫妻/伴侶', '8.疾厄/轉化', '9.遷移/高等', '10.官祿/事業', '11.福德/社交', '12.相貌/潛意識'] },
        "months": { type: 'circle', labels: ['一月', '二月', '三月', '四月', '五月', '六月', '七月', '八月', '九月', '十月', '十一月', '十二月'] }
      }
    };

    const SPREAD_NAMES = {
      "one": "單張占卜", "ppf": "過去/現在/未來", "spa": "現況/問題/建議", "bms": "身/心/靈", "neglect3": "三張無視論",
      "neglect": "五張無視論", "choice": "二擇一牌陣", "relation": "感情關係狀態陣",
      "weekly": "週運勢 (七天)", "celtic": "賽爾特十字 (10張大陣)", "houses": "十二宮位 (逆時針)", "months": "十二個月運勢"
    };

    function updateSpreadVariants() {
      const count = document.getElementById('cardCount').value;
      const variantSelect = document.getElementById('spreadVariant');
      variantSelect.innerHTML = '';
      const options = SPREAD_CONFIG[count];
      for (let key in options) {
        const opt = document.createElement('option');
        opt.value = key;
        opt.innerText = SPREAD_NAMES[key] || key;
        variantSelect.appendChild(opt);
      }
    }

    function getSelectedDeckConfig() {
      const key = document.getElementById('deckStyle')?.value || 'rider';
      return TAROT_DECKS[key] || TAROT_DECKS.rider;
    }

    function getDeck(incMajor, incMinor, deckConfig) {
      let deck = [];
      if (incMajor) MAJOR_NAMES.forEach((name, i) => deck.push({ name, file: deckConfig.majorFile(i) }));
      if (incMinor) {
        SUITS.forEach(suit => {
          for (let i = 1; i <= 14; i++) {
            let n = i === 1 ? "Ace" : (i === 11 ? "侍者" : (i === 12 ? "騎士" : (i === 13 ? "皇后" : (i === 14 ? "國王" : i))));
            const suitFileCode = deckConfig.suitCodeMap[suit.code] || suit.code;
            deck.push({ name: `${suit.name}${n}`, file: `${suitFileCode}${String(i).padStart(2, '0')}.jpg` });
          }
        });
      }
      return deck;
    }

    function copyToClipboard(text, btn) {
      const el = document.createElement('textarea');
      el.value = text;
      el.setAttribute('readonly', '');
      el.style.position = 'absolute';
      el.style.left = '-9999px';
      document.body.appendChild(el);
      el.select();
      try {
        const successful = document.execCommand('copy');
        if (successful && btn) {
          const originalText = btn.innerText;
          btn.innerText = "已複製！";
          setTimeout(() => { btn.innerText = originalText; }, 1500);
        }
      } catch (err) {}
      document.body.removeChild(el);
    }

    function copyAllHistory(btn) {
      const historyText = document.getElementById('history').value;
      if (!historyText) return;
      copyToClipboard(historyText.trim(), btn);
    }

    function copyLatestHistory(btn) {
      const historyText = document.getElementById('history').value;
      if (!historyText) return;
      const entries = historyText.split(/\n\s*\n+/);
      const latest = entries.find(e => e.trim().length > 0);
      if (latest) copyToClipboard(latest.trim(), btn);
    }

    // --- 新增：儲存紀錄到 LocalStorage ---
    function saveHistory() {
        const historyData = document.getElementById('history').value;
        localStorage.setItem(STORAGE_KEY, historyData);
    }

    // --- 修改：清除紀錄同時清除 LocalStorage ---
    function clearHistory() {
      if (document.getElementById('history').value === "") return;
      if (window.confirm("確定要清除所有占卜紀錄嗎？")) {
        document.getElementById('history').value = "";
        localStorage.removeItem(STORAGE_KEY); // 清除本地儲存
      }
    }

    function draw() {
      const incMajor = document.getElementById('incMajor').checked;
      const incMinor = document.getElementById('incMinor').checked;
      const allowRev = document.getElementById('allowRev').checked;
      const count = document.getElementById('cardCount').value;
      const variantKey = document.getElementById('spreadVariant').value;
      const deckConfig = getSelectedDeckConfig();
       
      if (!variantKey) return;
      const config = SPREAD_CONFIG[count][variantKey];
      let deck = getDeck(incMajor, incMinor, deckConfig);
      if (deck.length < config.labels.length) {
        alert("牌數不足，請檢查大牌/小牌勾選設定！");
        return;
      }

      for (let i = deck.length - 1; i > 0; i--) {
        const j = window.crypto.getRandomValues(new Uint32Array(1))[0] % (i + 1);
        [deck[i], deck[j]] = [deck[j], deck[i]];
      }

      const container = document.getElementById('spreadContainer');
      container.innerHTML = '';
      const spreadArea = document.createElement('div');
      spreadArea.className = `spread-area layout-${config.type}`;

      let results = [];
      config.labels.forEach((label, i) => {
        const cardData = deck[i];
        const isRev = allowRev && (window.crypto.getRandomValues(new Uint8Array(1))[0] > 127);
        const resultText = `${cardData.name}${isRev ? '(逆)' : ''}`;
        results.push(config.anonymousResult ? resultText : `${label}:${resultText}`);

        const slot = document.createElement('div');
        slot.className = 'card-slot';
        
        if (config.type === 'custom') {
          const c = config.coords[i];
          slot.style.position = 'absolute';
          slot.style.left = c.x + 'px';
          slot.style.top = c.y + 'px';
          if (c.z) slot.style.zIndex = c.z;
        } else if (config.type === 'circle') {
          // 十二宮位逆時針順序
          const angle = 180 - (i * 30);
          const r = 260; // 圓陣半徑加大
          const centerX = 300, centerY = 260;
          slot.style.position = 'absolute';
          slot.style.left = (centerX + r * Math.cos(angle * Math.PI / 180)) + 'px';
          slot.style.top = (centerY + r * Math.sin(angle * Math.PI / 180)) + 'px';
        }

        const card = document.createElement('div');
        card.className = `card ${isRev ? 'reversed' : ''}`;
        if (config.type === 'custom' && config.coords[i].rotate) {
            card.style.transform = `rotate(${config.coords[i].rotate}deg)`;
        }

        const img = document.createElement('img');
        img.src = `${deckConfig.imageBaseUrl}${cardData.file}`;
        img.onerror = () => {
          img.style.display = 'none';
          const fb = document.createElement('div');
          fb.className = 'fallback';
          fb.innerHTML = `缺少圖檔<br>${cardData.file}`;
          card.appendChild(fb);
        };

        const lbl = document.createElement('div');
        lbl.className = 'card-label';
        lbl.innerText = cardData.name;

        const tag = document.createElement('div');
        tag.className = 'pos-tag';
        tag.innerText = config.hideTags ? "" : label;

        card.appendChild(img);
        card.appendChild(lbl);
        slot.appendChild(tag);
        slot.appendChild(card);
        spreadArea.appendChild(slot);

        card.onclick = () => {
          const overlayImg = document.getElementById('overlayImg');
          overlayImg.src = img.src;
          overlayImg.className = isRev ? 'reversed' : '';
          document.getElementById('overlayTitle').innerText = cardData.name + (isRev ? ' (逆位)' : ' (正位)');
          document.getElementById('overlayPos').innerText = config.anonymousResult ? '' : `牌陣位置：${label}`;
          document.getElementById('overlay').classList.add('active');
        };
      });

      container.appendChild(spreadArea);
      autoScale();

      const q = document.getElementById('question').value || "未設問";
      const log = `【${new Date().toLocaleString()}】 ${q}\n牌組：${deckConfig.label}\n牌陣：${SPREAD_NAMES[variantKey]}\n結果：${results.join(' / ')}\n\n`;
      
      const historyArea = document.getElementById('history');
      historyArea.value = log + historyArea.value;
      
      // --- 新增：每次抽牌後自動儲存 ---
      saveHistory();
    }

    function autoScale() {
      const container = document.getElementById('spreadContainer');
      const viewport = document.querySelector('.spread-viewport');
      const spreadArea = container.querySelector('.spread-area');
      if (!spreadArea) return;

      // 取得目前的 CSS 變數基準
      const cardW = 140;
      const gap = 20;

      let baseWidth = 800; // 預設複雜陣型寬度
      if (spreadArea.classList.contains('layout-linear')) {
          const count = spreadArea.children.length;
          baseWidth = (cardW * count) + (gap * (count - 1));
      } else if (spreadArea.classList.contains('layout-custom')) {
          baseWidth = 800;
      } else if (spreadArea.classList.contains('layout-circle')) {
          baseWidth = 750;
      }

      const availableWidth = viewport.offsetWidth - 20;

      // 如果螢幕不夠寬，則縮小；如果夠寬，則維持 1:1 (大圖)
      if (availableWidth < baseWidth) {
        const scale = availableWidth / baseWidth;
        container.style.transform = `scale(${scale})`;
        viewport.style.height = (spreadArea.offsetHeight * scale + 100) + "px";
      } else {
        container.style.transform = 'scale(1)';
        viewport.style.height = "auto";
      }
    }

    window.addEventListener('resize', autoScale);
    document.getElementById('cardCount').addEventListener('change', updateSpreadVariants);
    document.getElementById('drawBtn').onclick = draw;
    
    // --- 新增：網頁載入時讀取紀錄 ---
    window.onload = () => { 
      updateSpreadVariants(); 
      
      // 讀取 LocalStorage
      const savedHistory = localStorage.getItem(STORAGE_KEY);
      if (savedHistory) {
          document.getElementById('history').value = savedHistory;
      }
    };
  </script>
</body>
</html>
